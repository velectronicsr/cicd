name: Advanced Lint & Build

on:
  push:
    branches: [ "main", "test-ci-web" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install HTML Linter
        run: npm install -g htmlhint

      - name: Lint HTML Code
        run: htmlhint index.html
